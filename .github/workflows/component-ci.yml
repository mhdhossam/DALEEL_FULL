name: Daleel Component CI

on:
  push:
    branches: [frontend, backend]
  pull_request:
    branches: [frontend, backend]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build, tests, and lint
    if: github.ref == 'refs/heads/frontend' || github.base_ref == 'frontend'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund
      - name: Build frontend
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint

  backend:
    name: Backend migrations, checks, and tests
    if: github.ref == 'refs/heads/backend' || github.base_ref == 'backend'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Check migrations
        env:
          DJANGO_SECRET_KEY: ci-only-not-for-production
          DEBUG: "True"
          ALLOWED_HOSTS: "localhost,127.0.0.1,[::1]"
          CORS_ALLOWED_ORIGINS: "http://localhost:8080"
        run: python manage.py makemigrations --check --dry-run
      - name: Migrate clean database
        env:
          DJANGO_SECRET_KEY: ci-only-not-for-production
          DEBUG: "True"
          ALLOWED_HOSTS: "localhost,127.0.0.1,[::1]"
          CORS_ALLOWED_ORIGINS: "http://localhost:8080"
        run: python manage.py migrate --noinput
      - name: Django system check
        env:
          DJANGO_SECRET_KEY: ci-only-not-for-production
          DEBUG: "True"
          ALLOWED_HOSTS: "localhost,127.0.0.1,[::1]"
          CORS_ALLOWED_ORIGINS: "http://localhost:8080"
        run: python manage.py check
      - name: Django tests
        env:
          DJANGO_SECRET_KEY: ci-only-not-for-production
          DEBUG: "True"
          ALLOWED_HOSTS: "localhost,127.0.0.1,[::1]"
          CORS_ALLOWED_ORIGINS: "http://localhost:8080"
        run: python manage.py test
