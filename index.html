<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  
  <!-- Responsive -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO -->
  <title>دليل - منصة دعم وتمكين ذوي الإعاقة</title>
  <meta name="description"
    content="منصة دليل الشاملة لدعم وتمكين ذوي الإعاقة من خلال التعليم والتكنولوجيا والخدمات المتكاملة" />
  
  <!-- Open Graph -->
  <meta property="og:title" content="دليل - منصة دعم وتمكين ذوي الإعاقة" />
  <meta property="og:description" content="منصة شاملة لدعم وتمكين ذوي الإعاقة" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="ar_AR" />

  <!-- Favicon (Vite way) -->
  <link rel="icon" type="image/webp" href="/logoFina2.webp" />

  <!-- Google Fonts Optimization -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
</head>

<body>
  <script>
    // Apply dark mode BEFORE paint to prevent flash of white
    (function(){
      var t = localStorage.getItem('theme');
      if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
