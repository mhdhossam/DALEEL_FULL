name: Assemble and verify Daleel component branches

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/split-app-branches.yml"
      - "README.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  frontend:
    name: Repair lockfile and verify frontend branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frontend branch
        uses: actions/checkout@v4
        with:
          ref: frontend
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Repair lockfile, run checks, and record results
        shell: bash
        run: |
          set +e
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          lock_status=$?

          if [ "$lock_status" -eq 0 ]; then
            git add package-lock.json
            if ! git diff --cached --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "fix(frontend): synchronize npm lockfile"
              git push origin HEAD:refs/heads/frontend
            fi
            npm ci --no-audit --no-fund
            install_status=$?
          else
            install_status=125
          fi

          build_status=125
          test_status=125
          lint_status=125
          if [ "$install_status" -eq 0 ]; then
            npm run build
            build_status=$?
            npm test
            test_status=$?
            npm run lint
            lint_status=$?
          fi

          status() {
            if [ "$1" -eq 0 ]; then echo "PASS (exit 0)"
            elif [ "$1" -eq 125 ]; then echo "SKIPPED (prerequisite failed)"
            else echo "FAIL (exit $1)"
            fi
          }
          cat > VERIFICATION.md <<EOF
          # Frontend Verification

          Recorded by GitHub Actions on $(date -u '+%Y-%m-%d %H:%M UTC').

          | Check | Result |
          |---|---|
          | Synchronize package lock | $(status "$lock_status") |
          | Clean dependency install (npm ci) | $(status "$install_status") |
          | Production build (npm run build) | $(status "$build_status") |
          | Unit tests (npm test) | $(status "$test_status") |
          | Lint (npm run lint) | $(status "$lint_status") |

          A result is marked PASS only when the command returned exit code 0.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERIFICATION.md package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "ci(frontend): record verification results"
            git push origin HEAD:refs/heads/frontend
          fi

          if [ "$lock_status" -ne 0 ] || [ "$install_status" -ne 0 ] || [ "$build_status" -ne 0 ] || [ "$test_status" -ne 0 ] || [ "$lint_status" -ne 0 ]; then
            exit 1
          fi

  backend:
    name: Build and verify backend branch
    runs-on: ubuntu-latest
    steps:
      - name: Check out target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clone the public source repository
        run: git clone --depth 1 --branch main https://github.com/mhdhossam/DALEELFULL.git ../daleel-source
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assemble, harden, and verify backend
        shell: bash
        run: |
          set +e
          git fetch origin main
          git checkout -B backend-build origin/main
          git rm -rf --ignore-unmatch .
          cp -a ../daleel-source/daleel_backend_generic_content_admin/. .
          find . -path './.git' -prune -o -type d -name '__pycache__' -exec rm -rf {} +
          find . -path './.git' -prune -o -type f -name '*.py[co]' -delete
          find . -path './.git' -prune -o -type f -name '.env' -delete
          find . -path './.git' -prune -o -type f -name 'db.sqlite3*' -delete

          cat > .gitignore <<'EOF'
          .env
          .env.*
          !.env.example
          __pycache__/
          *.py[cod]
          *.pyo
          *.pyd
          .venv/
          venv/
          env/
          db.sqlite3
          db.sqlite3-journal
          staticfiles/
          media/tmp/
          .pytest_cache/
          .coverage
          htmlcov/
          .mypy_cache/
          .ruff_cache/
          .vscode/
          .idea/
          .DS_Store
          Thumbs.db
          EOF

          cat > .env.example <<'EOF'
          DJANGO_SECRET_KEY=replace-with-a-long-random-secret
          DEBUG=True
          ALLOWED_HOSTS=localhost,127.0.0.1,[::1]
          CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080

          # Leave DB_NAME empty for local SQLite development. Set it to enable PostgreSQL.
          DB_NAME=
          DB_USER=postgres
          DB_PASSWORD=
          DB_HOST=localhost
          DB_PORT=5432

          PAYMOB_API_KEY=
          PAYMOB_INTEGRATION_ID=0
          PAYMOB_IFRAME_ID=
          PAYMOB_HMAC_SECRET=
          EOF

          cat > requirements.txt <<'EOF'
          Django>=5.1,<6.0
          djangorestframework>=3.15,<4.0
          djangorestframework-simplejwt>=5.3,<6.0
          django-cors-headers>=4.4,<5.0
          django-filter>=24.3,<26.0
          whitenoise>=6.7,<7.0
          cloudinary>=1.41,<2.0
          django-cloudinary-storage>=0.3.0,<0.4.0
          Pillow>=10.4,<13.0
          requests>=2.32,<3.0
          python-dotenv>=1.0,<2.0
          psycopg[binary]>=3.2,<4.0
          gunicorn>=23.0,<24.0
          EOF

          cat > README.md <<'EOF'
          # Daleel Backend

          Django REST Framework API for Daleel, an Arabic-first accessibility, learning, courses, and enrollment platform.

          ## Local setup

          Requires Python 3.12 or newer. Create and activate a virtual environment, then install dependencies:

          python -m venv .venv
          Windows: .venv\Scripts\activate
          macOS/Linux: source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

          Copy .env.example to .env and replace the example secret. The settings load this file automatically. Leave DB_NAME empty for local SQLite use; set the PostgreSQL variables only when you have a PostgreSQL database.

          Run the following development commands:

          python manage.py migrate
          python manage.py check
          python manage.py test
          python manage.py runserver

          ## Configuration

          - DJANGO_SECRET_KEY: unique random value; required when debug is off.
          - DEBUG: true only for local development.
          - ALLOWED_HOSTS: comma-separated hostnames.
          - CORS_ALLOWED_ORIGINS: comma-separated, explicit frontend origins.
          - DB_NAME, DB_USER, DB_PASSWORD, DB_HOST, DB_PORT: optional PostgreSQL config.
          - PAYMOB_*: optional payment integration settings.

          Do not commit real secrets, generated databases, bytecode, or production data. Frontend code is maintained on this repository's frontend branch.
          EOF

          python - <<'PY'
          from pathlib import Path
          p = Path("daleel_back/settings.py")
          s = p.read_text()
          s = s.replace(
              "from pathlib import Path\n",
              "from pathlib import Path\nfrom dotenv import load_dotenv\n",
              1,
          )
          s = s.replace(
              "BASE_DIR = Path(__file__).resolve().parent.parent\n",
              "BASE_DIR = Path(__file__).resolve().parent.parent\nload_dotenv(BASE_DIR / '.env')\n",
              1,
          )
          old_security = """SECRET_KEY = os.environ.get('DJANGO_SECRET_KEY', 'change-me-in-production')

          DEBUG = os.environ.get('DEBUG', 'True') == 'True'

          ALLOWED_HOSTS = os.environ.get('ALLOWED_HOSTS', '*').split(',')"""
          new_security = """_debug_value = os.environ.get("DEBUG", "False").strip().lower()
          DEBUG = _debug_value in {"1", "true", "yes", "on"}

          SECRET_KEY = os.environ.get("DJANGO_SECRET_KEY", "").strip()
          if not SECRET_KEY:
              if DEBUG:
                  SECRET_KEY = "dev-only-insecure-key-change-me"
              else:
                  raise RuntimeError("DJANGO_SECRET_KEY must be set when DEBUG is False.")

          ALLOWED_HOSTS = [
              host.strip()
              for host in os.environ.get(
                  "ALLOWED_HOSTS", "localhost,127.0.0.1,[::1]"
              ).split(",")
              if host.strip()
          ]"""
          if old_security not in s:
              raise SystemExit("Expected security settings block was not found; refusing to patch silently.")
          s = s.replace(old_security, new_security, 1)
          old_cors = """_cors_origins = os.environ.get('CORS_ALLOWED_ORIGINS', '')
          if _cors_origins:
              CORS_ALLOWED_ORIGINS = _cors_origins.split(',')
          else:
              CORS_ALLOW_ALL_ORIGINS = True   # dev only — fine without credentials

          CORS_ALLOW_CREDENTIALS = True"""
          new_cors = """_default_cors_origins = (
              "http://localhost:3000,http://127.0.0.1:3000,"
              "http://localhost:5173,http://127.0.0.1:5173,"
              "http://localhost:8080,http://127.0.0.1:8080"
              if DEBUG
              else ""
          )
          _cors_origins = os.environ.get("CORS_ALLOWED_ORIGINS", _default_cors_origins)
          CORS_ALLOWED_ORIGINS = [
              origin.strip() for origin in _cors_origins.split(",") if origin.strip()
          ]
          CORS_ALLOW_CREDENTIALS = True"""
          if old_cors not in s:
              raise SystemExit("Expected CORS settings block was not found; refusing to patch silently.")
          s = s.replace(old_cors, new_cors, 1)
          p.write_text(s)
          PY

          export DJANGO_SECRET_KEY=ci-only-not-for-production
          export DEBUG=True
          export ALLOWED_HOSTS=localhost,127.0.0.1,[::1]
          export CORS_ALLOWED_ORIGINS=http://localhost:8080
          unset DB_NAME DB_USER DB_PASSWORD DB_HOST DB_PORT
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          install_status=$?

          generate_status=125
          migration_check_status=125
          migrate_status=125
          check_status=125
          test_status=125
          if [ "$install_status" -eq 0 ]; then
            python manage.py makemigrations --noinput
            generate_status=$?
            python manage.py makemigrations --check --dry-run
            migration_check_status=$?
            python manage.py migrate --noinput
            migrate_status=$?
            python manage.py check
            check_status=$?
            python manage.py test
            test_status=$?
          fi

          status() {
            if [ "$1" -eq 0 ]; then echo "PASS (exit 0)"
            elif [ "$1" -eq 125 ]; then echo "SKIPPED (prerequisite failed)"
            else echo "FAIL (exit $1)"
            fi
          }
          cat > VERIFICATION.md <<EOF
          # Backend Verification

          Recorded by GitHub Actions on $(date -u '+%Y-%m-%d %H:%M UTC').

          | Check | Result |
          |---|---|
          | Install requirements.txt | $(status "$install_status") |
          | Generate missing migrations | $(status "$generate_status") |
          | Check migration consistency | $(status "$migration_check_status") |
          | Apply migrations to clean SQLite | $(status "$migrate_status") |
          | Django system check | $(status "$check_status") |
          | Django tests | $(status "$test_status") |

          Only commands with exit code 0 are marked PASS. Production Paymob transactions, deployment configuration, and live frontend/backend end-to-end flows are outside this automated run.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(backend): add standalone Django API and verification"
          git push origin HEAD:refs/heads/backend

          if [ "$install_status" -ne 0 ] || [ "$generate_status" -ne 0 ] || [ "$migration_check_status" -ne 0 ] || [ "$migrate_status" -ne 0 ] || [ "$check_status" -ne 0 ] || [ "$test_status" -ne 0 ]; then
            exit 1
          fi
